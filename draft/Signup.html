<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Therapeutic</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <script src='../src/js/packed_animator.js'></script>
  </head>
  <body class="bg-gradient-to-br from-indigo-300 to-purple-200 flex items-center justify-center min-h-screen">
    <div class="backdrop-blur-lg bg-white/30 border border-white/30 shadow-2xl hover:shadow-indigo-200 rounded-2xl p-8 w-full max-w-md transition-all duration-500 hover:scale-[1.02]"
        data-aos="fade-up">

      <h2 class="text-3xl font-bold text-center text-indigo-700 mb-6 transition-all duration-500 hover:text-indigo-800"
          data-aos="zoom-in" data-aos-delay="100">Create an Account</h2>

      <form data-aos="fade-up" data-aos-delay="200">
        <div class="mb-4 group" data-aos="fade-right" data-aos-delay="300">
          <label class="block text-gray-800 font-medium group-focus-within:text-indigo-600 transition duration-300" for="fullname">Full Name</label>
          <input type="text" id="fullname" placeholder="Your Name"
            class="mt-1 w-full px-4 py-2 bg-white/50 border-2 border-blue-200 rounded-lg backdrop-blur-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-indigo-400 transition duration-300 text-gray-800" />
        </div>

        <div class="mb-4 group" data-aos="fade-right" data-aos-delay="400">
          <label class="block text-gray-800 font-medium group-focus-within:text-indigo-600 transition duration-300" for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com"
            class="mt-1 w-full px-4 py-2 bg-white/50 border-2 border-blue-200 rounded-lg backdrop-blur-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-indigo-400 transition duration-300 text-gray-800" />
        </div>

        <div class="mb-4 group" data-aos="fade-right" data-aos-delay="500">
          <label class="block text-gray-800 font-medium group-focus-within:text-indigo-600 transition duration-300" for="password">Password</label>
          <input type="password" id="password" placeholder="Create a password"
            class="mt-1 w-full px-4 py-2 bg-white/50 border-2 border-blue-200 rounded-lg backdrop-blur-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-indigo-400 transition duration-300 text-gray-800" />
        </div>

        <div class="mb-6 group" data-aos="fade-right" data-aos-delay="600">
          <label class="block text-gray-800 font-medium group-focus-within:text-indigo-600 transition duration-300" for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" placeholder="Confirm your password"
            class="mt-1 w-full px-4 py-2 bg-white/50 border-2 border-blue-200 rounded-lg backdrop-blur-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-indigo-400 transition duration-300 text-gray-800" />
        </div>

        <button type="submit"
          class="w-full bg-indigo-500/90 text-white py-2 rounded-md hover:bg-indigo-600 transition transform duration-300 ease-in-out shadow-lg hover:shadow-indigo-400 active:scale-95">
          Sign Up
        </button>
      </form>

      <p class="text-center text-gray-700 mt-4 transition-all duration-300 hover:text-indigo-600"
        data-aos="slide-up" data-aos-delay="700">
        Already have an account?
        <a href="login.html" class="text-indigo-500 hover:underline">Login</a>
      </p>
    </div>
  </body>

</html>
