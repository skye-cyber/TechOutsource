<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Therapeutic</title>
    <script src='../src/js/packed_animator.js'></script>
    <link rel="stylesheet" href="../src/css/styles.css">
  </head>
  <body class="bg-gradient-to-br from-blue-50 via-purple-400 to-pink-200 flex items-center justify-center min-h-screen animate-gradientSlow bg-[length:200%_200%]">

    <div class="relative bg-white/60 backdrop-blur-lg shadow-lg rounded-2xl p-8 w-full max-w-md" data-aos="fade-up" data-aos-duration="800">
      <h2 class="text-3xl font-extrabold text-center mb-6 text-blue-700" data-aos="zoom-in" data-aos-delay="200">
        Welcome Back
      </h2>

      <!-- Login Form with validation messages -->
      <form id="loginForm" method="POST" action="login.php">
        <div class="relative" data-aos="fade-right" data-aos-delay="300">
          <label for="username" class="absolute -top-3 left-4 bg-white/10 px-1 text-sm text-gray-600 rounded-md">Email/Username</label>
          <input type="text" id="email" name="username" placeholder="you@example.com / user1"
                 class="peer w-full px-4 py-3 border-2 border-blue-200 rounded-xl focus:outline-none focus:ring-0 focus:border-blue-400 transition-colors" />
          <span id="emailError" class="error-msg text-sm text-red-500 mt-1 block h-4"></span>
          <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-blue-400 peer-focus:w-full transition-all duration-500"></span>
        </div>
        <div class="relative mt-4" data-aos="fade-left" data-aos-delay="300">
          <label for="password" class="absolute -top-3 left-4 bg-white/10 px-1 text-sm text-gray-600">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password"
                 class="peer w-full px-4 py-3 border-2 border-blue-200 rounded-xl focus:outline-none focus:ring-0 focus:border-blue-400 transition-colors" />
          <span id="passwordError" class="error-msg text-sm text-red-500 mt-1 block h-4"></span>
          <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-blue-400 peer-focus:w-full transition-all duration-500 delay-150"></span>
        </div>

        <div class="relative my-6 space-y-4">
            <label class="absolute -top-3 left-0 bg-white/10 px-1 text-sm text-gray-600" data-aos="fade-right" data-aos-delay="300">
                Usertype
            </label>
            <div id="usertype" class="flex flex-col gap-2 mt-2 ml-4 select-none">
                <label class="flex items-center gap-4 mt-2 cursor-pointer">
                    <input id="usertype1" type="radio" name="usertype" value="freelancer"
                        class="peer appearance-none w-5 h-5 border-2 border-blue-500 rounded-full checked:bg-blue-400 focus:outline-none transition-colors" />
                    <span class="text-sm text-gray-600 peer-checked:text-blue-600">Freelancer</span>
                </label>
                <label class="flex items-center gap-4 cursor-pointer">
                    <input id="usertype2" type="radio" name="usertype" value="employer"
                        class="peer appearance-none w-5 h-5 border-2 border-blue-500 rounded-full checked:bg-blue-400 focus:outline-none transition-colors" />
                    <span class="text-sm text-gray-600 peer-checked:text-blue-600 my-2">Employer</span>
                </label>
            </div>
            <span id="usertypeError" class="error-msg text-sm text-red-500 mt-1 block h-4"></span>
            <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-blue-400 peer-focus:w-full transition-all duration-500 delay-150"></span>
        </div>

        <button type="submit"
                class="w-full bg-blue-400 text-white py-3 rounded-xl hover:bg-blue-500 transform hover:scale-105 transition-all duration-300">
          Login
        </button>
      </form>
      <p class="text-center text-gray-600 mt-4" data-aos="fade-up" data-aos-delay="500">
        Don't have an account?
        <a href="signup.html" class="text-blue-500 hover:underline">Sign Up</a>
      </p>
    </div>

    <!-- Include validation script -->
    <script src="../src/js/loginValidator.js"></script>
  </body>
</html>
