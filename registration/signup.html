<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Therapeutic</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <script src='../src/js/packed_animator.js'></script>
  </head>
  <body class="bg-gradient-to-br from-indigo-300 to-purple-200 flex items-center justify-center min-h-screen">
    <!-- Responsive grid container -->
    <div class="w-fit max-w-3xl md:max-w-2xl mx-4 sm:mx-0 h-auto max-h-screen overflow-y-auto backdrop-blur-lg bg-white/30 border border-white/30 shadow-2xl rounded-2xl p-6 sm:p-8 transition-all duration-500 hover:scale-[1.02]" data-aos="fade-up">

      <h2 class="text-3xl font-bold text-center text-indigo-700 mb-6" data-aos="zoom-in" data-aos-delay="100">
        Create an Account
      </h2>

        <form method="POST" action="signup.php" class="grid grid-cols-1 md:grid-cols-2 gap-2 md:gap-4" data-aos="fade-up" data-aos-delay="200">
            <div class="col-span-1" data-aos="fade-right" data-aos-delay="300">
            <label for="name" class="block text-gray-800 font-medium">Username</label>
            <input type="text" id="name" name="name" placeholder="Name" required
                class="mt-1 w-full px-4 py-2 bg-white/50 border-2 border-blue-200 rounded-lg backdrop-blur-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 transition text-gray-800" />
            </div>

            <!-- Username -->
            <div class="col-span-1" data-aos="fade-right" data-aos-delay="300">
            <label for="username" class="block text-gray-800 font-medium">Username</label>
            <input type="text" id="username" name="username" placeholder="Username" required
                class="mt-1 w-full px-4 py-2 bg-white/50 border-2 border-blue-200 rounded-lg backdrop-blur-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 transition text-gray-800" />
            </div>
            <!-- Email -->
            <div class="relative col-span-1" data-aos="fade-right" data-aos-delay="400">
            <label for="email" class="block text-gray-800 font-medium">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required
                class="mt-1 w-full px-4 py-2 bg-white/50 border-2 border-blue-200 rounded-lg backdrop-blur-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 transition text-gray-800" />
            <span id="emailError" class="error-msg text-sm text-red-500 mt-1 block h-4"></span>
            <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-blue-400 peer-focus:w-full transition-all duration-500"></span>
            </div>
            <!-- Phone Number -->
            <div class="relative col-span-1" data-aos="fade-right" data-aos-delay="500">
            <label for="phoneNumber" class="block text-gray-800 font-medium">Phone Number</label>
            <input type="tel" id="phoneNumber" name="contactNo" placeholder="e.g. +2547xxxxxxx" required
                class="mt-1 w-full px-4 py-2 bg-white/50 border-2 border-blue-200 rounded-lg backdrop-blur-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 transition text-gray-800" />
                <span id="phoneError" class="error-msg text-sm text-red-500 mt-1 block h-4"></span>
            <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-blue-400 peer-focus:w-full transition-all duration-500"></span>
            </div>
            <!-- Country -->
            <div class="col-span-1" data-aos="fade-right" data-aos-delay="500">
            <label for="country" class="block text-gray-800 font-medium">Country</label>
            <input type="text" id="country" name="country" placeholder="Kenya" required
                class="mt-1 w-full px-4 py-2 bg-white/50 border-2 border-blue-200 rounded-lg backdrop-blur-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 transition text-gray-800" />
            </div>

            <!-- Dropdown for selecting freelance or employer -->
            <div class="relative col-span-1" data-aos="fade-right" data-aos-delay="600">
                <label for="userType" class="block text-gray-800 font-medium">Select User Type</label>
                <select id="userType" name="userType" class="mt-1 w-full px-4 py-2 bg-white/50 border-2 border-blue-200 rounded-lg backdrop-blur-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 transition text-gray-800">
                    <option value="freelancer">Freelance</option>
                    <option value="employer">Employer</option>
                </select>
            </div>

            <!-- Password -->
            <div class="col-span-1" data-aos="fade-right" data-aos-delay="600">
            <label for="password1" class="block text-gray-800 font-medium">Password</label>
            <input type="password" id="password1" name="password1" placeholder="Create a password" required
                class="mt-1 w-full px-4 py-2 bg-white/50 border-2 border-blue-200 rounded-lg backdrop-blur-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 transition text-gray-800" />
            </div>
            <!-- Confirm Password -->
            <div class="relative col-span-1" data-aos="fade-right" data-aos-delay="600">
            <label for="password2" class="block text-gray-800 font-medium">Confirm Password</label>
            <input type="password" id="password2" name="password2" placeholder="Confirm your password" required
                class="mt-1 w-full px-4 py-2 bg-white/50 border-2 border-blue-200 rounded-lg backdrop-blur-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 transition text-gray-800" />
                <span id="passError" class="error-msg text-sm text-red-500 mt-1 block h-4"></span>
            <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-blue-400 peer-focus:w-full transition-all duration-500"></span>
            </div>
            <!-- Submit Button spans two columns -->
            <div class="col-span-1 md:col-span-2 mt-1">
            <button type="submit" class="w-full bg-indigo-500/90 text-white py-2 rounded-md hover:bg-indigo-600 transition transform duration-300 ease-in-out shadow-lg hover:shadow-indigo-400 active:scale-95">
                Sign Up
            </button>
            </div>
      </form>

      <p class="col-span-1 md:col-span-2 text-center text-gray-700 mt-2 transition-all duration-300 select-none" data-aos="slide-up" data-aos-delay="700">
        Already have an account? <a href="login.html" class="select-text text-indigo-500 hover:underline">Login</a>
      </p>
    </div>

        <!-- Error Modal -->
    <div id="errorModal-x" class="fixed inset-0 flex items-center justify-center bg-black/50 backdrop-blur-sm z-50 animate-exit hidden transition duration-700">
        <div id="modalBody-x" class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full transform animate-exit transition-all duration-1000 opacity-0">
            <h2 id="modalTitle" class="text-2xl font-bold text-red-600 mb-4">Error</h2>
            <p id="modalMessage" class="text-gray-700 mb-6">Something went wrong.</p>
            <button id="closeModal" class="w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded-xl transition-all duration-300">
            Close
            </button>
        </div>
    </div>

    <!-- Error Modal -->
    <div id="errorModal" class="fixed top-2 left-1/5 transform -translate-x-[100vw] h-fit max-h-[40vh] overflow-y-auto w-fit max-w-[60vw] bg-white dark:bg-zinc-700/0 text-gray-800 dark:text-gray-100 opacity-100 pointer-events-none transition-all duration-1000 ease-in-out rounded-lg shadow-2xl z-40">
        <div id="modalBody" class="relative w-full bg-white transform transition-all duration-1000 py-4 px-8">
            <!-- Close Button -->
            <button id="closeErrModal" class="absolute top-1 right-1 text-teal-700 dark:text-blue-400 hover:text-sky-600 hover:rotate-45 duration-300 dark:hover:text-gray-400 transition-all duration-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <h2 id="modalErrTitle" class="text-2xl font-bold text-red-600 mb-4">Error</h2>
            <p id="modalErrMessage" class="text-gray-700 mb-6">Something went wrong.</p>
            <button id="closeErrModal-Bt" class="w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded-xl transition-all duration-300">
            Close
            </button>
        </div>
    </div>

  </body>
    <script src="../src/js/signupValidator.js"></script>
</html>
